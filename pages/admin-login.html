<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Administrativo | GOLAYA</title>
    <link rel="icon" type="image/x-icon" href="../assets/icons/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/icons/favicon/site.webmanifest" />

    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link href="https://googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Iconos Oficiales de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

    <!-- Enlace a los estilos -->
    <link rel="stylesheet" href="../css/views/admin-login.css" />
  </head>
  <body>
    <!-- Contenedor centrado -->
    <div class="login-container">
      <form class="login-form">
        <div class="brand-header">
          <h2 class="form-title">¡INICIAR SESION!</h2>
          <p class="form-subtitle">Ingresa tus datos para iniciar sesion.</p>
        </div>

        <!-- Mensaje de error global -->
        <div id="adminLoginError" class="login-error" style="display:none;"></div>

        <!-- Campos de Entrada -->
        <div class="input-group">
          <div class="input-wrapper">
            <input type="email" id="adminEmail" placeholder="Correo Electrónico" required />
          </div>
        </div>

        <div class="input-group">
          <div class="input-wrapper">
            <input type="password" id="adminPassword" placeholder="Contraseña" required />
          </div>
        </div>

        <!-- Opciones del Formulario -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            <span>Recordarme</span>
          </label>
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón Principal Premium -->
        <button type="submit" class="btn-submit" id="btnAdminLogin">
          <span class="btn-submit-text">Iniciar Sesión</span>
          <span class="btn-submit-spinner" style="display:none;">
            <i class="bi bi-arrow-repeat"></i> Ingresando...
          </span>
        </button>
      </form>
    </div>

    <script type="module" src="../js/views/admin-login.js"></script>
  </body>
</html>
